# Render Cloud Service Specification Blueprint
services:
  - type: web
    name: hybrid-ai-recommender
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 "src.api.app:create_app()"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: PORT
        value: 5000
